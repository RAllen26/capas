<!doctype html>
<meta charset="utf-8">
<title>CAPAS</title>
<!-- AR now lives inside the app. Old links and printed QR stickers (ar.html?piece=ID) land here and are forwarded. -->
<script>
  const id = new URLSearchParams(location.search).get('piece');
  location.replace(id ? './?scan=' + encodeURIComponent(id) : './#ar');
</script>
